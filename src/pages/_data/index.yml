textos_iconos:
  - id: texto1
    titulo: DIAGNÓSTICO
    texto: "Tú conoces a tu mascota como nadie, nosotros ponemos más de 20 años de experiencia. Juntos hacemos el mejor diagnóstico. ¿Nos cuentas?"
  - id: texto2
    titulo: ANÁLISIS
    texto: "A veces, lo importante está en el interior. Los análisis nos permiten ver más allá y asegurarnos de que tu mascota está bien por dentro y por fuera."
  - id: texto3
    titulo: VACUNACIÓN
    texto: "Prevenir siempre es mejor que curar. Las vacunas ayudan a tu mascota a estar protegida y a ti, a estar más tranquilo."
